<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
    }

    section {
      padding: 40px 20px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>Professional websites for small businesses</p>
    <a class="button" href="#contact">Contact Me</a>
  </header>

  <section>
    <h2>About Us</h2>
    <p>We provide quality services for our customers.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
  </section>

</body>
</html>
